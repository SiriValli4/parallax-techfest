<svg width="1900" height="1100" viewBox="0 0 1900 1100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;display=swap');
      .disp { font-family: 'Orbitron', 'Segoe UI', sans-serif; }
      .body { font-family: 'Rajdhani', 'Segoe UI', sans-serif; }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C16"/>
      <stop offset="55%" stop-color="#11142A"/>
      <stop offset="100%" stop-color="#170B2C"/>
    </linearGradient>

    <linearGradient id="fabricFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232A42"/>
      <stop offset="100%" stop-color="#12141F"/>
    </linearGradient>
    <linearGradient id="fabricBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262E4A"/>
      <stop offset="100%" stop-color="#111320"/>
    </linearGradient>
    <linearGradient id="hoodFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A324E"/>
      <stop offset="100%" stop-color="#171A2A"/>
    </linearGradient>
    <linearGradient id="sleeveFabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2438"/>
      <stop offset="100%" stop-color="#0F111C"/>
    </linearGradient>

    <linearGradient id="neonC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#7A2BFF"/>
    </linearGradient>
    <linearGradient id="neonM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E9F"/>
      <stop offset="100%" stop-color="#7A2BFF"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emblemGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E9F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF2E9F" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3A4166" opacity="0.5"/>
    </pattern>

    <!-- Reusable circuit trace (right-angle path with via dots) -->
    <g id="viaDot">
      <circle r="4" fill="#0A0C16" stroke-width="1.6"/>
      <circle r="1.6" fill="currentColor"/>
    </g>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1900" height="1100" fill="url(#bgGrad)"/>
  <rect width="1900" height="1100" fill="url(#dotGrid)"/>

  <!-- faint decorative background circuitry -->
  <g stroke="#2A3155" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M0,220 L140,220 L140,300 L340,300"/>
    <path d="M1900,860 L1750,860 L1750,760 L1560,760"/>
    <path d="M0,960 L120,960 L120,1020 L260,1020"/>
    <path d="M60,60 L60,140 L220,140"/>
  </g>
  <g fill="#2A3155" opacity="0.6">
    <circle cx="340" cy="300" r="3.5"/>
    <circle cx="1560" cy="760" r="3.5"/>
    <circle cx="260" cy="1020" r="3.5"/>
    <circle cx="220" cy="140" r="3.5"/>
  </g>

  <!-- ================= TITLE ================= -->
  <text x="80" y="58" class="disp" font-size="40" font-weight="800" fill="#EAF6FF" letter-spacing="2">TECHFEST<tspan fill="#00F5FF">//</tspan>HOODIE CONCEPT</text>
  <text x="80" y="88" class="body" font-size="19" fill="#8890B5" letter-spacing="1">Front &amp; Back Apparel Mockup — Cyber-Tech Streetwear Edition</text>
  <line x1="80" y1="106" x2="1820" y2="106" stroke="#262C4A" stroke-width="1.5"/>

  <!-- ================= FRONT HOODIE ================= -->
  <g transform="translate(80,150)" filter="url(#softShadow)">
    <!-- left sleeve -->
    <path d="M180,168 L66,198 L40,432 L98,458 L166,420 L200,222 Z" fill="url(#sleeveFabric)" stroke="#3A4270" stroke-width="2"/>
    <!-- right sleeve -->
    <path d="M460,168 L574,198 L600,432 L542,458 L474,420 L440,222 Z" fill="url(#sleeveFabric)" stroke="#3A4270" stroke-width="2"/>
    <!-- cuff ribs -->
    <g stroke="#4A5384" stroke-width="1.4" opacity="0.8">
      <path d="M52,410 L104,438"/>
      <path d="M58,394 L110,422"/>
      <path d="M64,378 L116,406"/>
      <path d="M588,410 L536,438"/>
      <path d="M582,394 L530,422"/>
      <path d="M576,378 L524,406"/>
    </g>

    <!-- torso -->
    <path d="M180,160 L460,160 L490,730 Q490,745 475,745 L165,745 Q150,745 150,730 Z" fill="url(#fabricFront)" stroke="#3A4270" stroke-width="2.5"/>

    <!-- waistband ribbing -->
    <path d="M158,700 L482,700 L479,730 Q479,738 470,738 L170,738 Q161,738 161,730 Z" fill="#161A2C" stroke="#3A4270" stroke-width="1.5"/>
    <g stroke="#4A5384" stroke-width="1.2" opacity="0.7">
      <line x1="175" y1="705" x2="175" y2="733"/>
      <line x1="205" y1="705" x2="205" y2="734"/>
      <line x1="235" y1="705" x2="235" y2="735"/>
      <line x1="265" y1="705" x2="265" y2="735"/>
      <line x1="295" y1="705" x2="295" y2="736"/>
      <line x1="325" y1="705" x2="325" y2="736"/>
      <line x1="355" y1="705" x2="355" y2="735"/>
      <line x1="385" y1="705" x2="385" y2="735"/>
      <line x1="415" y1="705" x2="415" y2="734"/>
      <line x1="445" y1="705" x2="445" y2="733"/>
      <line x1="465" y1="705" x2="465" y2="731"/>
    </g>

    <!-- hood -->
    <path d="M228,178 L228,102 Q228,44 320,38 Q412,44 412,102 L412,178 Q320,200 228,178 Z" fill="url(#hoodFabric)" stroke="#3A4270" stroke-width="2.5"/>
    <path d="M266,150 Q320,186 374,150" fill="none" stroke="#12141F" stroke-width="3" opacity="0.7"/>
    <path d="M255,120 Q320,95 385,120" fill="none" stroke="#4A5384" stroke-width="1.2" opacity="0.6"/>

    <!-- drawstrings -->
    <g stroke="#C9D3F5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M300,165 C293,205 306,245 297,286"/>
      <path d="M340,165 C347,205 334,245 343,286"/>
    </g>
    <circle cx="297" cy="292" r="5" fill="#C9D3F5"/>
    <circle cx="343" cy="292" r="5" fill="#C9D3F5"/>

    <!-- kangaroo pocket -->
    <path d="M232,492 Q232,480 246,480 L394,480 Q408,480 408,492 L408,558 Q408,570 396,570 L244,570 Q232,570 232,558 Z" fill="#171B2C" stroke="#3A4270" stroke-width="2"/>
    <path d="M246,500 Q320,516 394,500" fill="none" stroke="#0A0C16" stroke-width="2.5" opacity="0.8"/>

    <!-- chest emblem + circuit branding -->
    <circle cx="320" cy="300" r="72" fill="url(#emblemGlow)"/>
    <g filter="url(#glow)">
      <polygon points="320,248 358,270 358,314 320,336 282,314 282,270" fill="none" stroke="url(#neonC)" stroke-width="2.6"/>
      <circle cx="320" cy="292" r="20" fill="none" stroke="#00F5FF" stroke-width="2.2"/>
      <path d="M310,292 L316,292 L316,284 L324,284 L324,300 L332,300" fill="none" stroke="#00F5FF" stroke-width="2"/>
      <text x="320" y="297" text-anchor="middle" class="disp" font-size="11" font-weight="700" fill="#00F5FF" letter-spacing="1">TF</text>
    </g>
    <text x="320" y="360" text-anchor="middle" class="disp" font-size="15" font-weight="700" fill="#EAF6FF" letter-spacing="3">TECHFEST</text>
    <text x="320" y="378" text-anchor="middle" class="body" font-size="11" fill="#8890B5" letter-spacing="4">EST. 2026</text>

    <!-- circuit traces radiating from emblem (kept clear of the TECHFEST / EST.2026 text block at x:245-395, y:352-382) -->
    <g fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M282,270 L246,270 L246,232 L206,232" stroke="url(#neonC)" stroke-width="2"/>
      <path d="M358,270 L396,270 L396,224 L430,224" stroke="url(#neonM)" stroke-width="2"/>
      <path d="M282,314 L226,314 L226,398 L196,398" stroke="url(#neonC)" stroke-width="2"/>
      <path d="M358,314 L414,314 L414,398 L444,398" stroke="url(#neonM)" stroke-width="2"/>
      <path d="M320,336 L320,344 L228,344 L228,470" stroke="url(#neonC)" stroke-width="2"/>
    </g>
    <g color="#00F5FF">
      <use href="#viaDot" x="206" y="232" stroke="#00F5FF"/>
      <use href="#viaDot" x="196" y="398" stroke="#00F5FF"/>
      <use href="#viaDot" x="228" y="470" stroke="#00F5FF"/>
    </g>
    <g color="#FF2E9F">
      <use href="#viaDot" x="430" y="224" stroke="#FF2E9F"/>
      <use href="#viaDot" x="444" y="398" stroke="#FF2E9F"/>
    </g>

    <!-- sleeve accent stripes -->
    <path d="M70,230 L130,410" stroke="url(#neonC)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>
    <path d="M570,230 L510,410" stroke="url(#neonM)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>

    <text x="320" y="800" text-anchor="middle" class="disp" font-size="22" font-weight="700" fill="#C9D3F5" letter-spacing="6">FRONT</text>
  </g>

  <!-- ================= BACK HOODIE ================= -->
  <g transform="translate(760,150)" filter="url(#softShadow)">
    <!-- left sleeve -->
    <path d="M180,168 L66,198 L40,432 L98,458 L166,420 L200,222 Z" fill="url(#sleeveFabric)" stroke="#3A4270" stroke-width="2"/>
    <!-- right sleeve -->
    <path d="M460,168 L574,198 L600,432 L542,458 L474,420 L440,222 Z" fill="url(#sleeveFabric)" stroke="#3A4270" stroke-width="2"/>
    <g stroke="#4A5384" stroke-width="1.4" opacity="0.8">
      <path d="M52,410 L104,438"/>
      <path d="M58,394 L110,422"/>
      <path d="M64,378 L116,406"/>
      <path d="M588,410 L536,438"/>
      <path d="M582,394 L530,422"/>
      <path d="M576,378 L524,406"/>
    </g>

    <!-- torso -->
    <path d="M180,160 L460,160 L490,730 Q490,745 475,745 L165,745 Q150,745 150,730 Z" fill="url(#fabricBack)" stroke="#3A4270" stroke-width="2.5"/>

    <!-- waistband ribbing -->
    <path d="M158,700 L482,700 L479,730 Q479,738 470,738 L170,738 Q161,738 161,730 Z" fill="#161A2C" stroke="#3A4270" stroke-width="1.5"/>
    <g stroke="#4A5384" stroke-width="1.2" opacity="0.7">
      <line x1="175" y1="705" x2="175" y2="733"/>
      <line x1="205" y1="705" x2="205" y2="734"/>
      <line x1="235" y1="705" x2="235" y2="735"/>
      <line x1="265" y1="705" x2="265" y2="735"/>
      <line x1="295" y1="705" x2="295" y2="736"/>
      <line x1="325" y1="705" x2="325" y2="736"/>
      <line x1="355" y1="705" x2="355" y2="735"/>
      <line x1="385" y1="705" x2="385" y2="735"/>
      <line x1="415" y1="705" x2="415" y2="734"/>
      <line x1="445" y1="705" x2="445" y2="733"/>
      <line x1="465" y1="705" x2="465" y2="731"/>
    </g>

    <!-- hood (back, solid) -->
    <path d="M228,178 L228,102 Q228,44 320,38 Q412,44 412,102 L412,178 Q320,200 228,178 Z" fill="url(#hoodFabric)" stroke="#3A4270" stroke-width="2.5"/>
    <path d="M320,50 L320,190" stroke="#4A5384" stroke-width="1.2" opacity="0.6"/>

    <!-- center back seam -->
    <path d="M320,196 L320,730" stroke="#4A5384" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.6"/>

    <!-- big back emblem -->
    <circle cx="320" cy="360" r="130" fill="url(#emblemGlowM)"/>
    <g filter="url(#glow)">
      <polygon points="320,260 385,298 385,374 320,412 255,374 255,298" fill="none" stroke="url(#neonC)" stroke-width="3"/>
      <polygon points="320,290 360,313 360,359 320,382 280,359 280,313" fill="none" stroke="url(#neonM)" stroke-width="2"/>
      <circle cx="320" cy="336" r="26" fill="none" stroke="#00F5FF" stroke-width="2.4"/>
      <path d="M304,336 L312,336 L312,322 L328,322 L328,350 L336,350" fill="none" stroke="#00F5FF" stroke-width="2.2"/>
      <path d="M304,336 L296,336 L296,352 L288,352" fill="none" stroke="#FF2E9F" stroke-width="2"/>
    </g>
    <text x="320" y="452" text-anchor="middle" class="disp" font-size="34" font-weight="900" fill="#EAF6FF" letter-spacing="6">TECHFEST</text>
    <text x="320" y="476" text-anchor="middle" class="body" font-size="14" fill="#8890B5" letter-spacing="6">CODE · CREATE · CONNECT</text>

    <!-- circuit traces spreading across back (kept clear of the TECHFEST wordmark + tagline block at x:130-510, y:412-486) -->
    <g fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M255,298 L200,298 L200,240 L160,240" stroke="url(#neonC)" stroke-width="2"/>
      <path d="M385,298 L440,298 L440,240 L480,240" stroke="url(#neonM)" stroke-width="2"/>
      <path d="M255,374 L190,374 L190,398 L150,398" stroke="url(#neonM)" stroke-width="2"/>
      <path d="M385,374 L450,374 L450,398 L490,398" stroke="url(#neonC)" stroke-width="2"/>
      <path d="M250,560 L250,610 L210,610" stroke="url(#neonC)" stroke-width="2"/>
      <path d="M390,560 L390,610 L430,610" stroke="url(#neonM)" stroke-width="2"/>
    </g>
    <g color="#00F5FF">
      <use href="#viaDot" x="160" y="240" stroke="#00F5FF"/>
      <use href="#viaDot" x="490" y="398" stroke="#00F5FF"/>
      <use href="#viaDot" x="210" y="610" stroke="#00F5FF"/>
    </g>
    <g color="#FF2E9F">
      <use href="#viaDot" x="480" y="240" stroke="#FF2E9F"/>
      <use href="#viaDot" x="150" y="398" stroke="#FF2E9F"/>
      <use href="#viaDot" x="430" y="610" stroke="#FF2E9F"/>
    </g>

    <path d="M70,230 L130,410" stroke="url(#neonM)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>
    <path d="M570,230 L510,410" stroke="url(#neonC)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>

    <text x="320" y="800" text-anchor="middle" class="disp" font-size="22" font-weight="700" fill="#C9D3F5" letter-spacing="6">BACK</text>
  </g>

  <!-- ================= DIVIDER ================= -->
  <line x1="1450" y1="90" x2="1450" y2="1050" stroke="#262C4A" stroke-width="1.5"/>
  <g fill="#00F5FF" opacity="0.8">
    <circle cx="1450" cy="90" r="3"/>
    <circle cx="1450" cy="1050" r="3"/>
  </g>

  <!-- ================= SPEC / INFO PANEL ================= -->
  <g transform="translate(1480,90)">
    <rect x="0" y="0" width="380" height="940" rx="18" fill="#10121F" stroke="url(#neonC)" stroke-width="1.4" opacity="0.98"/>
    <rect x="0" y="0" width="380" height="940" rx="18" fill="none" stroke="#00F5FF" stroke-width="1.4" opacity="0.15" filter="url(#glowBig)"/>

    <text x="28" y="46" class="disp" font-size="20" font-weight="700" fill="#00F5FF" letter-spacing="3">SPEC SHEET</text>
    <line x1="28" y1="60" x2="352" y2="60" stroke="#262C4A" stroke-width="1.2"/>

    <!-- Design Concept -->
    <text x="28" y="92" class="disp" font-size="13" font-weight="700" fill="#FF2E9F" letter-spacing="2">DESIGN CONCEPT</text>
    <text x="28" y="118" class="body" font-size="15" fill="#C9D3F5">
      <tspan x="28" dy="0">A futuristic streetwear hoodie fusing</tspan>
      <tspan x="28" dy="22">cyberpunk circuitry with minimalist tech</tspan>
      <tspan x="28" dy="22">branding. Glowing neon traces mimic PCB</tspan>
      <tspan x="28" dy="22">pathways flowing outward from a central</tspan>
      <tspan x="28" dy="22">emblem — symbolising innovation, connect-</tspan>
      <tspan x="28" dy="22">ivity, and the pulse of Techfest's digital</tspan>
      <tspan x="28" dy="22">frontier. Dark fabric grounds the look while</tspan>
      <tspan x="28" dy="22">gradient neon accents keep it high-energy.</tspan>
    </text>

    <line x1="28" y1="300" x2="352" y2="300" stroke="#262C4A" stroke-width="1.2"/>

    <!-- Color Palette -->
    <text x="28" y="332" class="disp" font-size="13" font-weight="700" fill="#FF2E9F" letter-spacing="2">COLOR PALETTE</text>

    <g class="body">
      <!-- swatch 1 -->
      <rect x="28" y="350" width="44" height="44" rx="8" fill="#0B0E17" stroke="#3A4270" stroke-width="1.2"/>
      <text x="84" y="368" font-size="15" fill="#EAF6FF" font-weight="600">Void Black</text>
      <text x="84" y="387" font-size="13" fill="#8890B5" letter-spacing="1">#0B0E17 — base fabric</text>

      <!-- swatch 2 -->
      <rect x="28" y="406" width="44" height="44" rx="8" fill="#00F5FF"/>
      <text x="84" y="424" font-size="15" fill="#EAF6FF" font-weight="600">Neon Cyan</text>
      <text x="84" y="443" font-size="13" fill="#8890B5" letter-spacing="1">#00F5FF — primary circuitry</text>

      <!-- swatch 3 -->
      <rect x="28" y="462" width="44" height="44" rx="8" fill="#FF2E9F"/>
      <text x="84" y="480" font-size="15" fill="#EAF6FF" font-weight="600">Electric Magenta</text>
      <text x="84" y="499" font-size="13" fill="#8890B5" letter-spacing="1">#FF2E9F — secondary accent</text>

      <!-- swatch 4 -->
      <rect x="28" y="518" width="44" height="44" rx="8" fill="#7A2BFF"/>
      <text x="84" y="536" font-size="15" fill="#EAF6FF" font-weight="600">Ultraviolet Purple</text>
      <text x="84" y="555" font-size="13" fill="#8890B5" letter-spacing="1">#7A2BFF — gradient blend</text>

      <!-- swatch 5 -->
      <rect x="28" y="574" width="44" height="44" rx="8" fill="#F5F7FA" stroke="#3A4270" stroke-width="1"/>
      <text x="84" y="592" font-size="15" fill="#EAF6FF" font-weight="600">Signal White</text>
      <text x="84" y="611" font-size="13" fill="#8890B5" letter-spacing="1">#F5F7FA — logo &amp; highlights</text>
    </g>

    <line x1="28" y1="646" x2="352" y2="646" stroke="#262C4A" stroke-width="1.2"/>

    <!-- Fonts -->
    <text x="28" y="678" class="disp" font-size="13" font-weight="700" fill="#FF2E9F" letter-spacing="2">FONTS USED</text>

    <text x="28" y="712" class="disp" font-size="22" font-weight="800" fill="#EAF6FF" letter-spacing="2">Orbitron</text>
    <text x="28" y="732" class="body" font-size="13" fill="#8890B5">Display / Logotype — headlines, wordmark "TECHFEST"</text>

    <text x="28" y="772" class="body" font-size="22" font-weight="700" fill="#EAF6FF" letter-spacing="1">Rajdhani</text>
    <text x="28" y="792" class="body" font-size="13" fill="#8890B5">Body / UI — taglines, spec labels, fine print</text>

    <line x1="28" y1="826" x2="352" y2="826" stroke="#262C4A" stroke-width="1.2"/>
    <text x="28" y="858" class="disp" font-size="11" fill="#4A5384" letter-spacing="2">MATERIAL</text>
    <text x="28" y="878" class="body" font-size="14" fill="#C9D3F5">Heavyweight 320gsm cotton-poly fleece</text>

    <text x="28" y="912" class="disp" font-size="11" fill="#4A5384" letter-spacing="3">TECHFEST 2026 · APPAREL CONCEPT</text>
  </g>
</svg>
